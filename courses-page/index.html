<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程展示</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/courses.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="#">前端课程墙</a>
      <nav class="main-nav" aria-label="主要导航">
        <a href="#courses">全部课程</a>
        <a href="#about">关于</a>
      </nav>
    </div>
  </header>
  <main>
    <section id="courses">
      <h1>全部课程</h1>
      <div class="card-grid">
        <article class="course-card">
          <h2>HTML入门</h2>
          <p>结构与语义，页面一切的起点。</p>
          <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML">查看详情</a>
        </article>
        <article class="course-card">
          <h2>CSS布局</h2>
          <p>Flex、Grid与响应式设计。</p>
          <a href="https://developer.mozilla.org/zh-CN/docs/Web/CSS">查看详情</a>

          <h2>JavaScript基础</h2>
          <p>让页面动起来的第一门语言。</p>
          <a href="https://developer.mozilla.org/zh-CN/docs/Web/JavaScript">查看详情</a>
        </article>
      </div>
    </section>
    <section id="about">
      <h2>关于课程墙</h2>
      <p>本页面用于练习 Flex 导航、Grid 卡片墙和响应式布局。</p>
