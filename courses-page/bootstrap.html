<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程展示 Bootstrap版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">前端课程墙</a>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link active" href="#courses">全部课程</a>
        <a class="nav-link" href="#about">关于</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="courses">
      <h1 class="mb-3">全部课程</h1>
      <div class="alert alert-primary" role="alert">以下课程帮助学习网页开发基础。</div>
      <div class="row g-3">
        <div class="col-md-6 col-lg-4">
          <article class="card h-100">
            <div class="card-body">
              <h2 class="card-title h5">HTML入门</h2>
              <p class="card-text">结构与语义，页面一切的起点。</p>
              <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML" class="btn btn-primary">查看详情</a>
            </div>
          </article>
        </div>
        <div class="col-md-6 col-lg-4">
          <article class="card h-100">
            <div class="card-body">
              <h2 class="card-title h5">CSS布局</h2>
              <p class="card-text">Flex、Grid与响应式设计。</p>
              <a href="https://developer.mozilla.org/zh-CN/docs/Web/CSS" class="btn btn-primary">查看详情</a>
            </div>
          </article>
        </div>
        <div class="col-md-6 col-lg-4">
          <article class="card h-100">
            <div class="card-body">
              <h2 class="card-title h5">JavaScript基础</h2>
              <p class="card-text">让页面动起来的第一门语言。</p>
              <a href="https://developer.mozilla.org/zh-CN/docs/Web/JavaScript" class="btn btn-primary">查看详情</a>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section id="about" class="mt-5">
      <h2>关于课程墙</h2>
      <p>本页面使用 Bootstrap 栅格、导航栏、提示框、卡片和按钮组件完成响应式布局。</p>
    </section>
  </main>

  <footer class="container py-4 text-secondary">
    <p>课程演示案例 · Bootstrap版</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
